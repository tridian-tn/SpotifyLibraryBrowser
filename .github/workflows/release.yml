name: Release

# Tagging is what cuts a release: push v1.2.3 and this builds, tests and publishes it.
# A tag carrying a prerelease part (v1.2.3-rc.1) is marked as a prerelease on GitHub, which
# also makes it a safe way to rehearse this workflow.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag -replace '^v', ''

          # Fail early on a malformed tag rather than producing a package nobody can identify.
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Tag '$tag' isn't a version. Expected vMAJOR.MINOR.PATCH with an optional -prerelease."
          }

          $prerelease = if ($version -match '-') { 'true' } else { 'false' }

          "version=$version"       >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing $version (prerelease: $prerelease)"

      - name: Restore
        run: dotnet restore SpotifyLibraryBrowser.slnx

      - name: Build
        run: >
          dotnet build SpotifyLibraryBrowser.slnx
          --configuration Release --no-restore -warnaserror
          -p:Version=${{ steps.version.outputs.version }}

      # Nothing ships untested, even when the tag was pushed in a hurry.
      - name: Test
        run: dotnet test SpotifyLibraryBrowser.slnx --configuration Release --no-build

      # Two packages: a small one for anyone who already has the .NET runtime, and a standalone
      # one that needs nothing installed. A desktop app shouldn't require a prerequisite hunt.
      - name: Publish framework-dependent
        run: >
          dotnet publish src/SpotifyLibraryBrowser.App
          --configuration Release --runtime win-x64 --self-contained false
          -p:PublishSingleFile=true
          -p:Version=${{ steps.version.outputs.version }}
          --output artifacts/framework-dependent

      - name: Publish self-contained
        run: >
          dotnet publish src/SpotifyLibraryBrowser.App
          --configuration Release --runtime win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:Version=${{ steps.version.outputs.version }}
          --output artifacts/self-contained

      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Force -Path packages | Out-Null

          $builds = @{
            "SpotifyLibraryBrowser-$version-win-x64.zip"                = 'artifacts/framework-dependent'
            "SpotifyLibraryBrowser-$version-win-x64-self-contained.zip" = 'artifacts/self-contained'
          }

          foreach ($name in $builds.Keys) {
            Compress-Archive -Path "$($builds[$name])/*" -DestinationPath "packages/$name" -Force
            Write-Host "Packaged $name"
          }

          # Checksums, so a download can be verified against the release page.
          Get-ChildItem packages -Filter *.zip |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content packages/SHA256SUMS.txt -Encoding ascii

          Get-ChildItem packages | ForEach-Object { Write-Host "$($_.Name) $([math]::Round($_.Length / 1MB, 1)) MB" }

      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $flags = @(
            '--title', 'Spotify Library Browser ${{ steps.version.outputs.version }}',
            '--generate-notes'
          )

          if ('${{ steps.version.outputs.prerelease }}' -eq 'true') { $flags += '--prerelease' }

          gh release create '${{ github.ref_name }}' @flags (Get-ChildItem packages | ForEach-Object { $_.FullName })
